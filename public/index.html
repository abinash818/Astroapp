<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGlow - Ultimate Vedic Engine</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --p-1: #ff00cc;
            /* Vivid Pink */
            --p-2: #3333ff;
            /* Neon Blue */
            --p-3: #00ffcc;
            /* Cyan */
            --accent: #ffcc00;
            /* Gold */
            --bg: #05070a;
            --glass: rgba(20, 25, 40, 0.85);
            --border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 0, 204, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(51, 51, 255, 0.1) 0%, transparent 40%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            background: linear-gradient(to right, var(--p-1), var(--p-3), var(--p-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 0, 204, 0.3));
        }

        /* Colorful Form */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--p-1), var(--p-2), var(--p-3));
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
            font-weight: 600;
        }

        input,
        select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--p-1);
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.2);
            outline: none;
        }

        .search-container {
            grid-column: 1 / -1;
            position: relative;
        }

        #place-search {
            width: 100%;
            border-color: var(--p-3);
            background: rgba(0, 255, 204, 0.05);
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 0 0 15px 15px;
            z-index: 100;
            display: none;
        }

        .suggest-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }

        .suggest-item:hover {
            background: var(--p-2);
        }

        button.btn-main {
            grid-column: 1 / -1;
            background: linear-gradient(to right, var(--p-1), var(--p-2));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            letter-spacing: 4px;
        }

        button.btn-main:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(51, 51, 255, 0.4);
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--border);
            padding: 12px 30px;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--p-1);
            border-color: var(--p-1);
            box-shadow: 0 0 20px rgba(255, 0, 204, 0.4);
        }

        /* South Indian Chart */
        .chart-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            padding: 40px;
            border-radius: 40px;
        }

        .si-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 600px;
            height: 600px;
            gap: 4px;
            background: var(--p-3);
            border: 4px solid var(--p-3);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2);
        }

        .si-cell {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        .si-cell::after {
            content: attr(data-sign);
            position: absolute;
            bottom: 5px;
            right: 8px;
            font-size: 0.7rem;
            color: #444;
            font-weight: 800;
        }

        .si-cell.asc-highlight {
            background: rgba(255, 204, 0, 0.05);
        }

        .p-tag {
            background: linear-gradient(45deg, var(--p-1), var(--p-2));
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            font-weight: 800;
            margin: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .p-tag.asc {
            background: var(--accent);
            color: #000;
        }

        .si-center {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .si-center h2 {
            font-size: 2.5rem;
            color: var(--p-3);
            font-weight: 800;
        }

        /* Results Display */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .neon-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 30px;
            transition: 0.3s;
        }

        .neon-card:hover {
            border-color: var(--p-3);
            transform: scale(1.02);
        }

        .neon-card h3 {
            color: var(--p-3);
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            border-left: 4px solid var(--p-3);
            padding-left: 15px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lbl {
            color: #888;
            font-weight: 500;
        }

        .val {
            color: #fff;
            font-weight: 700;
        }

        /* Dasha Tree */
        .dasha-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .dasha-btn {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            padding: 5px;
        }

        .dasha-btn:hover {
            color: var(--p-1);
        }

        .loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid var(--p-2);
            border-top: 8px solid var(--p-1);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <h1>AstroGlow</h1>
            <p>The Most Advanced Vedic Engine on Earth</p>
        </header>

        <div class="glass-panel">
            <div class="search-container">
                <label>Search Place (City, Area...)</label>
                <input type="text" id="place-search" placeholder="Enter birth place..." autocomplete="off">
                <div class="suggestions" id="suggestions"></div>
            </div>
            <div class="input-group"><label>Date</label><input type="date" id="dob" value="1990-01-01"></div>
            <div class="input-group"><label>Time</label><input type="time" id="tob" step="1" value="12:00:00"></div>
            <div class="input-group"><label>Lat</label><input type="number" id="lat" value="28.6139" step="any"></div>
            <div class="input-group"><label>Lng</label><input type="number" id="lng" value="77.2090" step="any"></div>
            <div class="input-group"><label>TZ</label><input type="number" id="timezone" value="5.5" step="0.5"></div>
            <div class="input-group">
                <label>Ayanamsha</label>
                <select id="ayanamsha">
                    <option value="1">Lahiri (Main)</option>
                    <option value="3">Raman</option>
                    <option value="5">KP (Modern)</option>
                </select>
            </div>
            <button class="btn-main" onclick="calculate()">Ignite Calculations</button>
        </div>

        <div id="results" style="display:none">
            <div class="tabs">
                <button class="tab-btn active" onclick="tab(event, 't-chart')">South Chart</button>
                <button class="tab-btn" onclick="tab(event, 't-panchanga')">Panchangam</button>
                <button class="tab-btn" onclick="tab(event, 't-dasha')">Vimshottari</button>
                <button class="tab-btn" onclick="tab(event, 't-power')">Power & Yogas</button>
            </div>

            <div id="t-chart" class="tab-content active" style="display:block">
                <div class="chart-box">
                    <select id="varga-select" onchange="drawChart()"
                        style="margin-bottom:20px; background:var(--p-1); border:none; padding:10px 20px">
                        <option value="D1">D1 - Rashi</option>
                        <option value="D9" selected>D9 - Navamsha</option>
                        <option value="D10">D10 - Career</option>
                        <option value="D60">D60 - Soul</option>
                    </select>
                    <div class="si-grid" id="si-grid"></div>
                </div>
            </div>

            <div id="t-panchanga" class="tab-content" style="display:none">
                <div class="card-grid">
                    <div class="neon-card">
                        <h3>Core Elements</h3>
                        <div id="p-core"></div>
                    </div>
                    <div class="neon-card">
                        <h3>Muhurtas</h3>
                        <div id="p-muhurta"></div>
                    </div>
                    <div class="neon-card">
                        <h3>Solar Cycles</h3>
                        <div id="p-solar"></div>
                    </div>
                </div>
            </div>

            <div id="t-dasha" class="tab-content" style="display:none">
                <div class="neon-card" style="max-width:800px; margin:0 auto;">
                    <h3>Sub-Periods Hierarchy</h3>
                    <div id="d-tree"></div>
                </div>
            </div>

            <div id="t-power" class="tab-content" style="display:none">
                <div class="card-grid">
                    <div class="neon-card">
                        <h3>Shadbala Total</h3>
                        <div id="shad-list"></div>
                    </div>
                    <div class="neon-card">
                        <h3>Auspicious Yogas</h3>
                        <div id="yoga-list" style="display:flex; flex-wrap:wrap"></div>
                    </div>
                    <div class="neon-card">
                        <h3>SAV Bindus</h3>
                        <div id="sav-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalData = null;
        const SIGN_MAP = [[0, 0, 11], [1, 0, 0], [2, 0, 1], [3, 0, 2], [3, 1, 3], [3, 2, 4], [3, 3, 5], [2, 3, 6], [1, 3, 7], [0, 3, 8], [0, 2, 9], [0, 1, 10]];
        const SIGN_NAMES = ["Ar", "Ta", "Ge", "Cn", "Le", "Vi", "Li", "Sc", "Sg", "Cp", "Aq", "Pi"];

        // Place Search Logic
        const searchInput = document.getElementById('place-search');
        const suggestList = document.getElementById('suggestions');

        searchInput.addEventListener('input', async (e) => {
            if (e.target.value.length < 3) return;
            const res = await fetch(`/api/search-place?q=${e.target.value}`);
            const data = await res.json();
            suggestList.innerHTML = '';
            suggestList.style.display = 'block';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggest-item';
                div.textContent = item.display_name;
                div.onclick = () => {
                    document.getElementById('lat').value = item.lat;
                    document.getElementById('lng').value = item.lon;
                    searchInput.value = item.display_name;
                    suggestList.style.display = 'none';
                    updateTimeZone(item.lat, item.lon);
                };
                suggestList.appendChild(div);
            });
        });

        async function updateTimeZone(lat, lon) {
            // Simple heuristic for demo, in real app use a timezone API
            // For now let's hope user checks TZ
        }

        function tab(e, id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => { c.style.display = 'none'; });
            e.target.classList.add('active');
            document.getElementById(id).style.display = 'block';
        }

        async function calculate() {
            document.getElementById('loader').style.display = 'flex';
            const payload = {
                dateString: document.getElementById('dob').value,
                timeString: document.getElementById('tob').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                timezone: document.getElementById('timezone').value,
                ayanamsha: document.getElementById('ayanamsha').value
            };
            const res = await fetch('/calculate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await res.json();
            globalData = result.data;
            renderAll();
            document.getElementById('loader').style.display = 'none';
            document.getElementById('results').style.display = 'block';
        }

        function renderAll() {
            drawChart();
            renderPanchanga();
            renderDasha();
            renderMore();
        }

        function drawChart() {
            const v = document.getElementById('varga-select').value;
            const chart = globalData.vargas[v];
            const container = document.getElementById('si-grid');

            // Set dynamic title for Rasi/Amsam
            const chartTitle = v === 'D1' ? 'RASI (D1)' : (v === 'D9' ? 'AMSAM (D9)' : v);
            container.innerHTML = `<div class="si-center"><h2>${chartTitle}</h2></div>`;

            SIGN_MAP.forEach(([x, y, sid]) => {
                const cell = document.createElement('div');
                cell.className = 'si-cell';
                cell.style.gridColumn = x + 1; cell.style.gridRow = y + 1;
                cell.setAttribute('data-sign', SIGN_NAMES[sid]);

                Object.entries(chart).forEach(([pName, pData]) => {
                    if (SIGN_NAMES.indexOf(pData.sign.substring(0, 2)) === sid) {
                        const tag = document.createElement('span');
                        tag.className = 'p-tag' + (pName === 'Ascendant' ? ' asc' : '');
                        // Show name and exact degree for detail
                        const pNameShort = pName === 'Ascendant' ? 'Lagna' : pName.substring(0, 2);
                        tag.textContent = pNameShort;
                        cell.appendChild(tag);
                    }
                });
                container.appendChild(cell);
            });
        }

        function renderPanchanga() {
            const p = globalData.panchanga;
            const tc = globalData.tamilCalendar;
            document.getElementById('p-core').innerHTML = `
                ${row('Tamil Year', p.samvatsara.name)}
                ${row('Tamil Month', tc.monthName)}
                ${row('Tamil Date', tc.date)}
                ${row('Tithi', p.tithi.name)}
                ${row('Nakshatra', p.nakshatra.name)}
                ${row('Yoga', p.yoga.name)}
                ${row('Vaara', p.vaara.name)}
            `;
            document.getElementById('p-muhurta').innerHTML = `
                ${row('Rahu', p.muhurtas.raahuKaalam.start)}
                ${row('Abhijit', p.muhurtas.abhijitMuhurta.start)}
                ${row('Brahma', p.muhurtas.brahmaMuhurta.start)}
            `;
            document.getElementById('p-solar').innerHTML = `
                ${row('Sunrise', p.sunrise.string)}
                ${row('Lunar Month', p.lunarMonth.name)}
                ${row('Solar Sign', p.solarMonth.name)}
            `;
        }

        function renderDasha() {
            const tree = document.getElementById('d-tree'); tree.innerHTML = '';

            // 1. Show Current Active Dasha Summary
            if (globalData.activeDasha) {
                const ad = globalData.activeDasha;
                const activeDiv = document.createElement('div');
                activeDiv.className = 'neon-card';
                activeDiv.style.marginBottom = '30px';
                activeDiv.style.borderColor = 'var(--p-1)';
                activeDiv.innerHTML = `
                    <h3 style="color:var(--p-1)">Current Active Periods (Now)</h3>
                    ${row('Mahadasha', ad.mahadasha.lord + ' (until ' + new Date(ad.mahadasha.endDate).toLocaleDateString() + ')')}
                    ${row('Bhukti (Antar)', ad.antardasha.lord + ' (until ' + new Date(ad.antardasha.endDate).toLocaleDateString() + ')')}
                    ${row('Antara (Pratyantar)', ad.pratyantardasha.lord + ' (until ' + new Date(ad.pratyantardasha.endDate).toLocaleDateString() + ')')}
                    ${row('Sukshma', ad.sookshmadasha.lord + ' (until ' + new Date(ad.sookshmadasha.endDate).toLocaleDateString() + ')')}
                    ${row('Prana', ad.pranadasha.lord + ' (until ' + new Date(ad.pranadasha.endDate).toLocaleDateString() + ')')}
                `;
                tree.appendChild(activeDiv);
            }

            // 2. Hierarchical Dasha Tree
            const header = document.createElement('h3');
            header.textContent = 'Full Dasha Timeline';
            header.style.marginBottom = '15px';
            tree.appendChild(header);

            globalData.dashaTree.forEach((m) => {
                const div = document.createElement('div'); div.className = 'dasha-item';
                div.innerHTML = `
                    <div class="dasha-btn" onclick="toggleDasha(this)">
                        <span style="color:var(--p-3)">${m.lord} MAHA</span> 
                        <span>Ends: ${new Date(m.endDate).toLocaleDateString()}</span>
                    </div>
                    <div class="sub" style="display:none; padding-left:15px; margin-top:10px; border-left: 1px solid var(--border);"></div>
                `;
                const sub = div.querySelector('.sub');
                m.antardashas.forEach(a => {
                    const aDiv = document.createElement('div');
                    aDiv.style.marginBottom = '5px';
                    aDiv.innerHTML = `
                        <div class="dasha-btn" style="font-size:0.9rem" onclick="toggleDasha(this)">
                            <span>${a.lord} Bhukti</span> <span>${new Date(a.endDate).toLocaleDateString()}</span>
                        </div>
                        <div class="sub-sub" style="display:none; padding-left:15px; margin-top:5px; border-left: 1px dashed var(--border);"></div>
                    `;
                    const subSub = aDiv.querySelector('.sub-sub');
                    a.pratyantardashas.forEach(p => {
                        const pDiv = document.createElement('div');
                        pDiv.style.fontSize = '0.85rem';
                        pDiv.innerHTML = `
                            <div class="dasha-btn" onclick="toggleDasha(this)">
                                <span style="color:#aaa">${p.lord} Antara</span> <span>${new Date(p.endDate).toLocaleDateString()}</span>
                            </div>
                            <div class="sub-sukshma" style="display:none; padding-left:15px; margin-top:5px; font-size:0.8rem; color:#888;"></div>
                        `;
                        const sukSub = pDiv.querySelector('.sub-sukshma');
                        p.sookshmadashas.forEach(s => {
                            sukSub.innerHTML += `<div class="data-row"><span>${s.lord} Sukshma</span><span>${new Date(s.endDate).toLocaleDateString()}</span></div>`;
                        });
                        subSub.appendChild(pDiv);
                    });
                    sub.appendChild(aDiv);
                });
                tree.appendChild(div);
            });
        }

        function toggleDasha(el) {
            const next = el.nextElementSibling;
            if (next) next.style.display = (next.style.display === 'none' ? 'block' : 'none');
        }

        function renderMore() {
            let shad = '', yog = '';
            ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].forEach((p, i) => shad += row(p, globalData.shadbala.total[i].toFixed(1)));
            document.getElementById('shad-list').innerHTML = shad;
            globalData.yogas.forEach(y => yog += `<span class="p-tag" style="padding:10px">${y}</span>`);
            document.getElementById('yoga-list').innerHTML = yog;
        }

        function row(l, v) { return `<div class="data-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`; }
    </script>

</body>

</html>
