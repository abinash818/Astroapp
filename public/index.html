<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Astro Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #f59e0b;
            --bg: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.9);
            --text: #f3f4f6;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #0b0f19;
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header & Form */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            color: #9ca3af;
            font-size: 0.8rem;
        }

        input,
        select {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
        }

        button {
            grid-column: 1 / -1;
            background: var(--primary);
            border: none;
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            color: #9ca3af;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* South Indian Chart */
        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .si-chart {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 500px;
            height: 500px;
            border: 2px solid var(--primary);
            background: rgba(0, 0, 0, 0.5);
        }

        .si-cell {
            border: 1px solid var(--border);
            padding: 5px;
            display: flex;
            flex-direction: column;
            font-size: 0.75rem;
            position: relative;
        }

        .si-cell .sign-name {
            color: #4b5563;
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 0.6rem;
        }

        .si-cell .planet-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .si-cell .planet-item {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 4px;
            padding: 1px 4px;
            color: #fff;
            font-weight: 600;
        }

        .si-cell .asc-item {
            color: var(--accent) !important;
            font-weight: bold;
            border: 1px solid var(--accent);
        }

        .si-center {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 600;
        }

        /* Data Layouts */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .lbl {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .val {
            font-weight: 600;
        }

        /* Dasha Tree */
        .dasha-tree {
            font-size: 0.85rem;
            max-height: 500px;
            overflow-y: auto;
        }

        .dasha-maha {
            border-left: 2px solid var(--primary);
            padding-left: 10px;
            margin-bottom: 10px;
        }

        .dasha-andar {
            margin-left: 15px;
            border-left: 1px dotted #4b5563;
            padding-left: 10px;
            color: #9ca3af;
        }

        .dasha-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .dasha-header:hover {
            color: #fff;
        }

        .loader {
            display: none;
            text-align: center;
            color: var(--primary);
            margin: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Astro Ultimate</h1>
            <p>Full Vedic Engine</p>
        </header>

        <div class="input-panel">
            <div class="form-grid">
                <div class="input-group"><label>DOB</label><input type="date" id="dob" value="1990-01-01"></div>
                <div class="input-group"><label>Time</label><input type="time" id="tob" step="1" value="12:00:00"></div>
                <div class="input-group"><label>Lat</label><input type="number" id="lat" value="28.6139" step="any">
                </div>
                <div class="input-group"><label>Lng</label><input type="number" id="lng" value="77.2090" step="any">
                </div>
                <div class="input-group"><label>TZ</label><input type="number" id="timezone" value="5.5" step="0.5">
                </div>
                <div class="input-group">
                    <label>Ayanamsha</label>
                    <select id="ayanamsha">
                        <option value="1">Lahiri</option>
                        <option value="3">Raman</option>
                        <option value="5">KP</option>
                    </select>
                </div>
                <button onclick="calculate()">Generate Cosmic Report</button>
            </div>
        </div>

        <div id="loader" class="loader">Aligning planets... 🔭</div>

        <div id="results" style="display:none">
            <div class="tabs">
                <button class="tab-btn active" onclick="tab(event, 't-charts')">Charts</button>
                <button class="tab-btn" onclick="tab(event, 't-panchanga')">Panchanga</button>
                <button class="tab-btn" onclick="tab(event, 't-dasha')">Dasha (Sukshma)</button>
                <button class="tab-btn" onclick="tab(event, 't-more')">Strength & Yogas</button>
            </div>

            <!-- Charts Tab -->
            <div id="t-charts" class="tab-content active">
                <div class="chart-container">
                    <div class="input-group" style="width: 250px;">
                        <label>Division (Varga)</label>
                        <select id="varga-select" onchange="drawChart()">
                            <option value="D1">D1 - Rashi</option>
                            <option value="D2">D2 - Hora</option>
                            <option value="D3">D3 - Drekkana</option>
                            <option value="D4">D4 - Chaturthamsha</option>
                            <option value="D7">D7 - Saptamsha</option>
                            <option value="D9" selected>D9 - Navamsha</option>
                            <option value="D10">D10 - Dashamsha</option>
                            <option value="D12">D12 - Dwadashamsha</option>
                            <option value="D60">D60 - Shashtyamsha</option>
                        </select>
                    </div>
                    <div class="si-chart" id="si-chart">
                        <!-- South Indian Chart JS Generated -->
                    </div>
                </div>
            </div>

            <!-- Panchanga Tab -->
            <div id="t-panchanga" class="tab-content">
                <div class="grid-layout">
                    <div class="card">
                        <h3>5 Elements (Panchangam)</h3>
                        <div id="p-core"></div>
                    </div>
                    <div class="card">
                        <h3>Muhurtas</h3>
                        <div id="p-muhurta"></div>
                    </div>
                    <div class="card">
                        <h3>Solar/Lunar Details</h3>
                        <div id="p-solar"></div>
                    </div>
                </div>
            </div>

            <!-- Dasha Tab -->
            <div id="t-dasha" class="tab-content">
                <div class="card">
                    <h3>Vimshottari Dasha Tree (Maha → Antar → Pratyantar → Sukshma)</h3>
                    <div id="d-tree" class="dasha-tree"></div>
                </div>
            </div>

            <!-- More Tab -->
            <div id="t-more" class="tab-content">
                <div class="grid-layout">
                    <div class="card">
                        <h3>Doshas</h3>
                        <div id="m-doshas"></div>
                    </div>
                    <div class="card">
                        <h3>Yogas</h3>
                        <div id="m-yogas"></div>
                    </div>
                    <div class="card">
                        <h3>Shadbala</h3>
                        <div id="m-shadbala"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalData = null;
        const SIGN_INDEX_MAP = [
            [0, 0, 11], [1, 0, 0], [2, 0, 1], [3, 0, 2], // Pisces, Aries, Taurus, Gemini
            [0, 1, 10], [3, 1, 3],         // Aquarius, Cancer
            [0, 2, 9], [3, 2, 4],         // Capricorn, Leo
            [0, 3, 8], [1, 3, 7], [2, 3, 6], [3, 3, 5] // Sagit, Scorpio, Libra, Virgo
        ];
        const SIGN_NAMES = ["Ar", "Ta", "Ge", "Cn", "Le", "Vi", "Li", "Sc", "Sg", "Cp", "Aq", "Pi"];

        function tab(e, id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        async function calculate() {
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            loader.style.display = 'block'; results.style.display = 'none';

            const payload = {
                dateString: document.getElementById('dob').value,
                timeString: document.getElementById('tob').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                timezone: document.getElementById('timezone').value,
                ayanamsha: document.getElementById('ayanamsha').value
            };

            const res = await fetch('/calculate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const { data } = await res.json();
            globalData = data;

            renderAll();
            loader.style.display = 'none'; results.style.display = 'block';
        }

        function renderAll() {
            drawChart();
            renderPanchanga();
            renderDasha();
            renderMore();
        }

        function drawChart() {
            const varga = document.getElementById('varga-select').value;
            const chartData = globalData.vargas[varga];
            const container = document.getElementById('si-chart');
            container.innerHTML = '<div class="si-center">' + varga + '</div>';

            // Pre-fill cells
            const cells = {};
            SIGN_INDEX_MAP.forEach(([x, y, signId]) => {
                const div = document.createElement('div');
                div.className = 'si-cell';
                div.style.gridColumn = x + 1;
                div.style.gridRow = y + 1;
                div.innerHTML = `<span class="sign-name">${SIGN_NAMES[signId]}</span><div class="planet-list" id="cell-${signId}"></div>`;
                container.appendChild(div);
                cells[signId] = div.querySelector('.planet-list');
            });

            Object.entries(chartData).forEach(([pName, pData]) => {
                const signId = SIGN_NAMES.indexOf(pData.sign.substring(0, 2));
                if (cells[signId]) {
                    const span = document.createElement('span');
                    span.className = 'planet-item' + (pName === 'Ascendant' ? ' asc-item' : '');
                    span.textContent = pName === 'Ascendant' ? 'La' : pName.substring(0, 2);
                    cells[signId].appendChild(span);
                }
            });
        }

        function renderPanchanga() {
            const p = globalData.panchanga;
            document.getElementById('p-core').innerHTML = `
            ${row('Tithi', p.tithi.name + ' (' + p.tithi.paksha + ')')}${row('Nakshatra', p.nakshatra.name + ' (Pad ' + p.nakshatra.pada + ')')}${row('Yoga', p.yoga.name)}${row('Karana', p.karana.name)}${row('Vaara', p.vaara.name)}
        `;
            document.getElementById('p-muhurta').innerHTML = `
            ${row('Rahu Kaalam', p.muhurtas.raahuKaalam.start + ' - ' + p.muhurtas.raahuKaalam.end)}
            ${row('Yamaganda', p.muhurtas.yamagandaKaalam.start + ' - ' + p.muhurtas.yamagandaKaalam.end)}
            ${row('Abhijit', p.muhurtas.abhijitMuhurta.start + ' - ' + p.muhurtas.abhijitMuhurta.end)}
            ${row('Brahma', p.muhurtas.brahmaMuhurta.start + ' - ' + p.muhurtas.brahmaMuhurta.end)}
        `;
            document.getElementById('p-solar').innerHTML = `
            ${row('Sunrise', p.sunrise.string)}${row('Sunset', p.sunset.string)}${row('Moonrise', p.moonrise.string)}${row('Lunar Month', p.lunarMonth.name)}${row('Solar Month', p.solarMonth.name)}
        `;
        }

        function renderDasha() {
            const container = document.getElementById('d-tree');
            container.innerHTML = '';
            globalData.dashaTree.forEach((maha, mIdx) => {
                const div = document.createElement('div');
                div.className = 'dasha-maha';
                div.innerHTML = `
                <div class="dasha-header" onclick="toggleD(this)">
                    <span>${maha.lord} Mahadasha</span>
                    <span>Ends: ${new Date(maha.endDate).toLocaleDateString()}</span>
                </div>
                <div class="sub-dasha" style="display:none"></div>
            `;
                const sub = div.querySelector('.sub-dasha');
                maha.antardashas.forEach(antar => {
                    const aDiv = document.createElement('div');
                    aDiv.className = 'dasha-andar';
                    aDiv.innerHTML = `<div class="dasha-header" onclick="toggleD(this)"><span>- ${antar.lord}</span><span>${new Date(antar.endDate).toLocaleDateString()}</span></div>
                <div class="pratyantar" style="display:none; margin-left:15px; font-size:0.75rem;"></div>`;

                    const prSub = aDiv.querySelector('.pratyantar');
                    antar.pratyantardashas.forEach(prat => {
                        const pDiv = document.createElement('div');
                        pDiv.innerHTML = `<div class="dasha-header" onclick="toggleD(this)"><span>-- ${prat.lord}</span><span>${new Date(prat.endDate).toLocaleDateString()}</span></div>
                    <div class="sukshma" style="display:none; margin-left:15px; color:#888;"></div>`;

                        const skSub = pDiv.querySelector('.sukshma');
                        prat.sookshmadashas.forEach(suk => {
                            skSub.innerHTML += `<div class="dasha-row" style="display:flex; justify-content:space-between; padding:2px 0;"><span>--- ${suk.lord}</span><span>${new Date(suk.endDate).toLocaleDateString()}</span></div>`;
                        });
                        prSub.appendChild(pDiv);
                    });
                    sub.appendChild(aDiv);
                });
                container.appendChild(div);
            });
        }

        function toggleD(el) {
            const next = el.nextElementSibling;
            if (next) next.style.display = next.style.display === 'none' ? 'block' : 'none';
        }

        function renderMore() {
            let d = '', y = '', s = '';
            Object.entries(globalData.doshas).forEach(([k, v]) => d += `<div style="margin-bottom:8px"><b>${k}:</b> ${v.message}</div>`);
            globalData.yogas.forEach(yoga => y += `<div class="val">${yoga}</div>`);
            ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].forEach((p, i) => s += row(p, globalData.shadbala.total[i].toFixed(1) + ' VP'));
            document.getElementById('m-doshas').innerHTML = d;
            document.getElementById('m-yogas').innerHTML = y;
            document.getElementById('m-shadbala').innerHTML = s;
        }

        function row(l, v) { return `<div class="data-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`; }
    </script>

</body>

</html>
