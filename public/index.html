<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGlow Pro - Professional Vedic Software</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --p-1: #ff00cc;
            --p-2: #3333ff;
            --p-3: #00ffcc;
            --accent: #ffcc00;
            --bg: #05070a;
            --glass: rgba(20, 25, 40, 0.9);
            --border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            background: linear-gradient(to right, var(--p-1), var(--p-3), var(--p-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Form */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input,
        select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
        }

        button.btn-main {
            grid-column: 1 / -1;
            background: linear-gradient(to right, var(--p-1), var(--p-2));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #111;
            border: 1px solid var(--border);
            padding: 10px 25px;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--p-1);
            border-color: var(--p-1);
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Chart */
        .chart-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .si-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 550px;
            height: 550px;
            background: var(--p-3);
            border: 2px solid var(--p-3);
            border-radius: 15px;
            overflow: hidden;
        }

        .si-cell {
            background: #000;
            border: 0.5px solid rgba(0, 255, 204, 0.1);
            padding: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .si-cell::after {
            content: attr(data-sign);
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 0.65rem;
            color: #444;
        }

        .p-tag {
            background: linear-gradient(45deg, var(--p-1), var(--p-2));
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .p-tag.asc {
            background: var(--accent);
            color: #000;
        }

        .si-center {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
            background: #05070a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Data Display */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .neon-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .neon-card h3 {
            color: var(--p-3);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .lbl {
            color: #888;
        }

        .val {
            font-weight: 700;
        }

        /* Table */
        .kp-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .kp-table th,
        .kp-table td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
        }

        .kp-table th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--p-3);
            text-transform: uppercase;
        }

        /* Porutham */
        .match-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .match-results {
            border-top: 1px solid var(--p-1);
            padding-top: 20px;
        }

        .match-score {
            font-size: 2rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
        }

        .loader {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #333;
            border-top: 5px solid var(--p-1);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <h1>AstroGlow Pro</h1>
            <p>Professional Vedic & KP Engine</p>
        </header>

        <div class="glass-panel" id="main-form">
            <div class="input-group" style="grid-column: 1/-1;">
                <label>Place Search</label>
                <input type="text" id="place-search" placeholder="Type city (e.g. Madurai)...">
                <div id="suggestions"
                    style="position:absolute; background:#111; width:100%; z-index:10; border:1px solid var(--border); display:none; top:300px;">
                </div>
            </div>
            <div class="input-group"><label>Date</label><input type="date" id="dob" value="1990-01-01"></div>
            <div class="input-group"><label>Time</label><input type="time" id="tob" step="1" value="12:00:00"></div>
            <div class="input-group"><label>Lat</label><input type="number" id="lat" value="28.6139" step="any"></div>
            <div class="input-group"><label>Lng</label><input type="number" id="lng" value="77.2090" step="any"></div>
            <div class="input-group"><label>TZ</label><input type="number" id="timezone" value="5.5" step="0.5"></div>
            <div class="input-group">
                <label>Ayanamsha</label>
                <select id="ayanamsha">
                    <option value="1">Lahiri</option>
                    <option value="3">Raman</option>
                    <option value="5">KP</option>
                </select>
            </div>
            <button class="btn-main" onclick="calculate()">Calculate Report</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('t-report')">Report & Charts</button>
            <button class="tab-btn" onclick="showTab('t-kp')">KP Significators</button>
            <button class="tab-btn" onclick="showTab('t-match')">Horoscope Matching</button>
        </div>

        <div id="t-report" class="tab-content active">
            <div class="chart-section" style="margin-bottom: 40px;">
                <select id="varga-select" onchange="drawChart()"
                    style="margin-bottom:15px; padding:8px 15px; background:var(--p-1); border:none; border-radius:10px; color:#fff;">
                    <option value="D1">Rasi (D1)</option>
                    <option value="D9" selected>Amsam (D9)</option>
                    <option value="D10">Career (D10)</option>
                </select>
                <div class="si-grid" id="si-grid"></div>
            </div>
            <div class="card-grid">
                <div class="neon-card">
                    <h3>Panchangam</h3>
                    <div id="p-data"></div>
                </div>
                <div class="neon-card">
                    <h3>Planetary Positions</h3>
                    <div id="planet-data"></div>
                </div>
            </div>
        </div>

        <div id="t-kp" class="tab-content">
            <div class="neon-card" style="margin-bottom: 20px;">
                <h3>KP Planet Significators</h3>
                <table class="kp-table">
                    <thead id="kp-planets-head"></thead>
                    <tbody id="kp-planets-body"></tbody>
                </table>
            </div>
            <div class="neon-card">
                <h3>KP House (Cusp) Significators</h3>
                <table class="kp-table">
                    <thead id="kp-houses-head"></thead>
                    <tbody id="kp-houses-body"></tbody>
                </table>
            </div>
        </div>

        <div id="t-match" class="tab-content">
            <div class="neon-card">
                <h3>Porutham Matching (South Indian)</h3>
                <div class="match-form">
                    <div>
                        <h4 style="color:var(--p-1); margin-bottom:10px;">Boy's Info</h4>
                        <div class="input-group"><label>Nakshatra</label><select id="boy-nak"></select></div>
                        <div class="input-group" style="margin-top:10px;"><label>Rasi</label><select
                                id="boy-rasi"></select></div>
                    </div>
                    <div>
                        <h4 style="color:var(--p-3); margin-bottom:10px;">Girl's Info</h4>
                        <div class="input-group"><label>Nakshatra</label><select id="girl-nak"></select></div>
                        <div class="input-group" style="margin-top:10px;"><label>Rasi</label><select
                                id="girl-rasi"></select></div>
                    </div>
                </div>
                <button class="btn-main" onclick="runMatching()">Check Match</button>
                <div id="match-results" class="match-results" style="display:none;">
                    <div class="match-score" id="match-score-display"></div>
                    <div class="card-grid" id="match-details"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalData = null;
        const SIGN_MAP = [[0, 0, 11], [1, 0, 0], [2, 0, 1], [3, 0, 2], [3, 1, 3], [3, 2, 4], [3, 3, 5], [2, 3, 6], [1, 3, 7], [0, 3, 8], [0, 2, 9], [0, 1, 10]];
        const SIGN_NAMES = ["Ar", "Ta", "Ge", "Cn", "Le", "Vi", "Li", "Sc", "Sg", "Cp", "Aq", "Pi"];
        const NAKSHATRAS = ["Ashwini", "Bharani", "Krittika", "Rohini", "Mrigashira", "Ardra", "Punarvasu", "Pushya", "Ashlesha", "Magha", "P.Phalguni", "U.Phalguni", "Hasta", "Chitra", "Swati", "Vishakha", "Anuradha", "Jyeshtha", "Mula", "P.Ashada", "U.Ashada", "Shravana", "Dhanishta", "Shatabhisha", "P.Bhadra", "U.Bhadra", "Revati"];

        const nakSelects = [document.getElementById('boy-nak'), document.getElementById('girl-nak')];
        const rasiSelects = [document.getElementById('boy-rasi'), document.getElementById('girl-rasi')];
        nakSelects.forEach(sel => NAKSHATRAS.forEach((n, i) => sel.innerHTML += `<option value="${i}">${n}</option>`));
        rasiSelects.forEach(sel => SIGN_NAMES.forEach((s, i) => sel.innerHTML += `<option value="${i}">${s}</option>`));

        function showTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="showTab('${id}')"]`).classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        async function calculate() {
            document.getElementById('loader').style.display = 'flex';
            const payload = {
                dateString: document.getElementById('dob').value,
                timeString: document.getElementById('tob').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                timezone: document.getElementById('timezone').value,
                ayanamsha: document.getElementById('ayanamsha').value
            };
            try {
                const res = await fetch('/calculate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await res.json();
                globalData = result.data;
                renderAll();
            } catch (e) { alert("Error: " + e.message); }
            document.getElementById('loader').style.display = 'none';
            showTab('t-report');
        }

        function renderAll() {
            drawChart();
            renderPanchanga();
            renderKP();
            let html = '';
            Object.entries(globalData.planets).forEach(([p, d]) => {
                html += `<div class="data-row"><span>${p}</span><span>${d.longitude.toFixed(2)}° ${d.sign}</span></div>`;
            });
            document.getElementById('planet-data').innerHTML = html;
        }

        function row(l, v) { return `<div class="data-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`; }

        function renderPanchanga() {
            const p = globalData.panchanga;
            document.getElementById('p-data').innerHTML = `
            ${row('Tithi', p.tithi.name)}
            ${row('Nakshatra', p.nakshatra.name)}
            ${row('Yoga', p.yoga.name)}
            ${row('Karana', p.karana.name)}
            ${row('Vara', p.vara.name)}
        `;
        }

        function drawChart() {
            const v = document.getElementById('varga-select').value;
            const vData = globalData.vargas[v];
            const container = document.getElementById('si-grid');
            container.innerHTML = `<div class="si-center"><h2 style="color:var(--p-3)">${v}</h2></div>`;
            SIGN_MAP.forEach(([x, y, sid]) => {
                const cell = document.createElement('div'); cell.className = 'si-cell';
                cell.style.gridColumn = x + 1; cell.style.gridRow = y + 1; cell.setAttribute('data-sign', SIGN_NAMES[sid]);
                Object.entries(vData).forEach(([p, d]) => {
                    if (SIGN_NAMES.indexOf(d.sign.substring(0, 2)) === sid) {
                        const tag = document.createElement('span'); tag.className = 'p-tag' + (p === 'Ascendant' ? ' asc' : '');
                        tag.textContent = p === 'Ascendant' ? 'LA' : p.substring(0, 2).toUpperCase();
                        cell.appendChild(tag);
                    }
                });
                container.appendChild(cell);
            });
        }

        function renderKP() {
            const pHead = document.getElementById('kp-planets-head');
            const pBody = document.getElementById('kp-planets-body');
            pHead.innerHTML = `<tr><th>Planet</th><th>Sign Lord</th><th>Star Lord</th><th>Sub Lord</th><th>SS Lord</th></tr>`;
            pBody.innerHTML = '';
            Object.entries(globalData.planets).forEach(([p, d]) => {
                pBody.innerHTML += `<tr><td>${p}</td><td>${d.kp.signLord}</td><td>${d.kp.starLord}</td><td>${d.kp.subLord}</td><td>${d.kp.subSubLord}</td></tr>`;
            });
            const hHead = document.getElementById('kp-houses-head');
            const hBody = document.getElementById('kp-houses-body');
            hHead.innerHTML = `<tr><th>Cusp</th><th>Sign</th><th>Sign Lord</th><th>Star Lord</th><th>Sub Lord</th></tr>`;
            hBody.innerHTML = '';
            globalData.houses.forEach(h => {
                hBody.innerHTML += `<tr><td>${h.id}</td><td>${h.sign}</td><td>${h.kp.signLord}</td><td>${h.kp.starLord}</td><td>${h.kp.subLord}</td></tr>`;
            });
        }

        async function runMatching() {
            const payload = {
                boyNak: document.getElementById('boy-nak').value,
                girlNak: document.getElementById('girl-nak').value,
                boySign: document.getElementById('boy-rasi').value,
                girlSign: document.getElementById('girl-rasi').value
            };
            const res = await fetch('/api/porutham', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const { match } = await res.json();
            const resultsDiv = document.getElementById('match-results');
            resultsDiv.style.display = 'block';
            document.getElementById('match-score-display').textContent = `Total Score: ${match.totalScore} / ${match.maxTotal}`;
            let detailsHtml = '';
            match.matches.forEach(m => {
                const status = m.score > 0 ? '✔️' : '❌';
                detailsHtml += `<div class="neon-card"><h3>${m.name} ${status}</h3><div class="data-row">Score: ${m.score}/${m.maxScore}</div><p style="font-size:0.8rem; color:#aaa">${m.description}</p></div>`;
            });
            document.getElementById('match-details').innerHTML = detailsHtml;
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('place-search').addEventListener('input', async (e) => {
            if (e.target.value.length < 3) return;
            const res = await fetch(`/api/search-place?q=${e.target.value}`);
            const data = await res.json();
            const suggestions = document.getElementById('suggestions');
            suggestions.innerHTML = ''; suggestions.style.display = 'block';
            data.forEach(item => {
                const div = document.createElement('div'); div.style.padding = '10px'; div.style.cursor = 'pointer'; div.style.borderBottom = '1px solid #222';
                div.textContent = item.display_name;
                div.onclick = () => {
                    document.getElementById('lat').value = item.lat;
                    document.getElementById('lng').value = item.lon;
                    document.getElementById('place-search').value = item.display_name;
                    suggestions.style.display = 'none';
                };
                suggestions.appendChild(div);
            });
        });
    </script>
</body>

</html>
