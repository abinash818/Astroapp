<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGlow Pro - Professional Vedic Software</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --p-1: #ff00cc;
            --p-2: #3333ff;
            --p-3: #00ffcc;
            --accent: #ffcc00;
            --bg: #05070a;
            --glass: rgba(20, 25, 40, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --hdr: #0a8f5f;
            /* Green header from screenshot */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Premium Header */
        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            background: linear-gradient(to right, var(--p-1), var(--p-3), var(--p-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.3));
        }

        /* Modern Form */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 35px;
            margin-bottom: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        input,
        select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            border-color: var(--p-3);
            background: rgba(255, 255, 255, 0.06);
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .btn-ignite {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--p-1), var(--p-2));
            border: none;
            padding: 18px;
            border-radius: 15px;
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-ignite:hover {
            transform: scale(1.01);
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
        }

        /* Report Modal Theme */
        .report-header {
            background: var(--hdr);
            padding: 15px 25px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #fff;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
        }

        .report-body {
            background: #fff;
            color: #333;
            border-radius: 0 0 15px 15px;
            padding: 25px;
        }

        /* Professional Planet Table */
        .p-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .p-table th {
            background: var(--hdr);
            color: #fff;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            text-align: left;
            text-transform: uppercase;
        }

        .p-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
        }

        .p-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .status-tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .status-exalted {
            background: #e6ffed;
            color: #22863a;
        }

        .status-debilitated {
            background: #ffeef0;
            color: #d73a49;
        }

        .status-neutral {
            background: #f6f8fa;
            color: #586069;
        }

        .status-friend {
            background: #f1f8ff;
            color: #0366d6;
        }

        .status-enemy {
            background: #fff5eb;
            color: #e36209;
        }

        .status-own {
            background: #fff8c5;
            color: #735c0f;
        }

        /* Professional Chart */
        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #fff;
            border-radius: 15px;
            border: 1px solid #ddd;
        }

        .si-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 480px;
            height: 480px;
            border: 2px solid #555;
            background: #fff;
        }

        .si-cell {
            border: 0.5px solid #ccc;
            position: relative;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px;
        }

        .si-cell::after {
            content: attr(data-sign);
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.6rem;
            color: #bbb;
            pointer-events: none;
        }

        .planet-icon {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            color: #333;
        }

        .planet-icon.asc {
            border: 1.5px solid #d73a49;
            color: #d73a49;
        }

        .si-center {
            grid-column: 2/4;
            grid-row: 2/4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #d73a49;
            border: 1px solid #ccc;
        }

        /* Dasha System */
        .dasha-box {
            margin-top: 30px;
        }

        .dasha-active {
            border: 2px solid var(--p-3);
            padding: 15px;
            border-radius: 15px;
            background: rgba(0, 255, 204, 0.05);
        }

        .loader {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #333;
            border-top: 5px solid var(--p-3);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 20px;
            border-radius: 20px;
            background: #eee;
            color: #555;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .tab.active {
            background: var(--hdr);
            color: #fff;
        }

        /* Suggestions */
        .suggestions {
            position: absolute;
            top: 100%;
            background: #1a1a1a;
            border: 1px solid var(--border);
            width: 100%;
            z-index: 100;
            border-radius: 12px;
            margin-top: 5px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .suggest-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .suggest-item:hover {
            background: #222;
            color: var(--p-3);
        }

        /* Detail Area */
        #results {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <h1>AstroGlow Pro</h1>
            <p>Professional Vedic Astrology Engine</p>
        </header>

        <div class="glass-panel">
            <div class="form-grid">
                <div class="input-group" style="grid-column: 1 / -1; position: relative;">
                    <label>Place of Birth</label>
                    <input type="text" id="place-search" placeholder="Enter city name (e.g. Madurai, Chennai)...">
                    <div class="suggestions" id="suggestions"></div>
                </div>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="user-name" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="input-group"><label>Birth Date</label><input type="date" id="dob" value="1993-10-29"></div>
                <div class="input-group"><label>Birth Time</label><input type="time" id="tob" step="1" value="06:45:00">
                </div>
                <div class="input-group"><label>Timezone</label><input type="number" id="timezone" value="5.5"
                        step="0.5"></div>
                <input type="hidden" id="lat" value="9.9252">
                <input type="hidden" id="lng" value="78.1198">
                <button class="btn-ignite" onclick="calculate()">Generate Professional Chart</button>
            </div>
        </div>

        <div id="results">
            <div class="report-header" id="r-header">
                <span id="header-text">Match Chart - 1993-10-29 | Madurai, India</span>
                <span style="cursor:pointer" onclick="document.getElementById('results').style.display='none'">✖</span>
            </div>
            <div class="report-body">
                <table class="p-table">
                    <thead>
                        <tr>
                            <th>இராகம்</th>
                            <th>ராசி</th>
                            <th>நட்சத்திரம்</th>
                            <th>நட்சத்திர நாதன்</th>
                            <th>பாதம்</th>
                            <th>நிலை</th>
                            <th>டிகிரி</th>
                        </tr>
                    </thead>
                    <tbody id="p-table-body"></tbody>
                </table>

                <div class="chart-container">
                    <div class="tabs">
                        <div class="tab active" onclick="switchVarga(event, 'D1')">இராசி கட்டம்</div>
                        <div class="tab" onclick="switchVarga(event, 'D9')">அம்ச கட்டம்</div>
                        <div class="tab" onclick="switchVarga(event, 'D10')">பவ கட்டம் (D10)</div>
                    </div>
                    <div style="font-size:0.7rem; color:#888; font-weight:800; margin-bottom:10px;">இராசி கட்டம்
                        (Dignity Colors)</div>
                    <div class="si-grid" id="si-grid"></div>
                </div>

                <div class="dasha-box" id="dasha-active-area"></div>
                <div id="full-dasha" style="margin-top:20px; color:#555"></div>
            </div>
        </div>
    </div>

    <script>
        let globalData = null;
        let currentVarga = 'D1';
        const SIGN_MAP = [[0, 0, 11], [1, 0, 0], [2, 0, 1], [3, 0, 2], [3, 1, 3], [3, 2, 4], [3, 3, 5], [2, 3, 6], [1, 3, 7], [0, 3, 8], [0, 2, 9], [0, 1, 10]];
        const SIGN_NAMES_EN = ["Ar", "Ta", "Ge", "Cn", "Le", "Vi", "Li", "Sc", "Sg", "Cp", "Aq", "Pi"];

        async function calculate() {
            document.getElementById('loader').style.display = 'flex';
            const payload = {
                dateString: document.getElementById('dob').value,
                timeString: document.getElementById('tob').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                timezone: document.getElementById('timezone').value,
                ayanamsha: 1
            };
            try {
                const res = await fetch('/calculate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await res.json();
                globalData = result.data;

                document.getElementById('header-text').textContent = `Professional Chart - ${payload.dateString} ${payload.timeString} | ${document.getElementById('place-search').value}`;
                renderAll();
                document.getElementById('results').style.display = 'block';
                window.scrollTo({ top: document.getElementById('results').offsetTop - 50, behavior: 'smooth' });
            } catch (e) { alert("Error: " + e.message); }
            document.getElementById('loader').style.display = 'none';
        }

        function renderAll() {
            renderPlanetTable();
            drawChart();
            renderActiveDasha();
        }

        function renderPlanetTable() {
            const body = document.getElementById('p-table-body');
            body.innerHTML = '';
            Object.entries(globalData.planets).forEach(([name, d]) => {
                const tr = document.createElement('tr');
                const deg = Math.floor(d.longitude % 30);
                const min = Math.floor(((d.longitude % 30) - deg) * 60);

                const statusClass = `status-${d.dignity.toLowerCase().replace(' ', '-')}`;

                tr.innerHTML = `
                <td><strong>${d.nameTamil}</strong> <br><small style="color:#888">${name}</small></td>
                <td>${d.signTamil} <br><small style="color:#888">(${d.sign})</small></td>
                <td>${d.nakshatra.name}</td>
                <td>${d.nakshatra.lord}</td>
                <td>${d.nakshatra.pada}</td>
                <td><span class="status-tag ${statusClass}">${d.dignityTamil || d.dignity}</span></td>
                <td>${deg}° ${min}'</td>
            `;
                body.appendChild(tr);
            });
        }

        function drawChart() {
            const chartData = globalData.vargas[currentVarga];
            const container = document.getElementById('si-grid');
            container.innerHTML = `<div class="si-center"><span>${currentVarga === 'D1' ? 'RASI' : (currentVarga === 'D9' ? 'D9' : 'D10')}</span></div>`;

            SIGN_MAP.forEach(([x, y, sid]) => {
                const cell = document.createElement('div');
                cell.className = 'si-cell';
                cell.style.gridColumn = x + 1; cell.style.gridRow = y + 1;
                cell.setAttribute('data-sign', SIGN_NAMES_EN[sid]);

                // Fix: Add planets by sign logic
                Object.entries(chartData).forEach(([pName, pVal]) => {
                    const pSignIdx = SIGN_NAMES_EN.indexOf(pVal.sign.substring(0, 2));
                    if (pSignIdx === sid) {
                        const span = document.createElement('span');
                        span.className = 'planet-icon' + (pName === 'Ascendant' ? ' asc' : '');
                        span.textContent = pName === 'Ascendant' ? 'ல' : globalData.tamilData.planets[pName].substring(0, 2);
                        cell.appendChild(span);
                    }
                });
                container.appendChild(cell);
            });
        }

        function switchVarga(e, v) {
            currentVarga = v;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            drawChart();
        }

        function renderActiveDasha() {
            // Simple Dasha Highlight for Demo
            const now = new Date();
            const activeArea = document.getElementById('dasha-active-area');
            activeArea.innerHTML = '<h3>Current Active Dasha</h3>';

            // Finding active dasha from tree
            const tree = globalData.dashas;
            for (const m of tree) {
                const end = new Date(m.endDate);
                if (end > now) {
                    let html = `<div class="dasha-active">
                    <div style="font-weight:800; color:var(--p-1); margin-bottom:10px;">Current Mahadasha: ${m.lord}</div>
                    <div style="font-size:0.9rem">Ends on: ${end.toLocaleDateString()}</div>`;

                    for (const a of m.antardashas) {
                        const aEnd = new Date(a.endDate);
                        if (aEnd > now) {
                            html += `<div style="font-weight:700; color:var(--p-2); margin-top:10px;">Antardasha (Bhukti): ${a.lord}</div>
                                 <div style="font-size:0.8rem">Ends on: ${aEnd.toLocaleDateString()}</div>`;
                            break;
                        }
                    }
                    html += `</div>`;
                    activeArea.innerHTML += html;
                    break;
                }
            }
        }

        // Geocoding Proxy logic
        const searchInput = document.getElementById('place-search');
        const suggestList = document.getElementById('suggestions');

        searchInput.addEventListener('input', async (e) => {
            if (e.target.value.length < 3) return;
            const res = await fetch(`/api/search-place?q=${e.target.value}`);
            const data = await res.json();
            suggestList.innerHTML = '';
            suggestList.style.display = 'block';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggest-item';
                div.textContent = item.display_name;
                div.onclick = () => {
                    document.getElementById('lat').value = item.lat;
                    document.getElementById('lng').value = item.lon;
                    searchInput.value = item.display_name;
                    suggestList.style.display = 'none';
                };
                suggestList.appendChild(div);
            });
        });
    </script>

</body>

</html>
